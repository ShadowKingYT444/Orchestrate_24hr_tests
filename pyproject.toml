[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrate-eval"
version = "0.2.0"
description = "Offline, evidence-first local agent harness evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orchestrate-eval = "orchestrate_eval.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrate_eval*"]
